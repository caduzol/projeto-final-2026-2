<!DOCTYPE html>
<!-- Bella Napoli Pizzaria — Catálogo com carrinho (JavaScript) -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bella Napoli Pizzaria</title>
  <meta name="description" content="Cardápio interativo com pedido (carrinho JS)." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="nav">
      <div class="logo">🍕 Bella Napoli Pizzaria</div>
      <button class="menu-toggle" aria-label="Menu">☰</button>
      <ul id="menu">
        <li><a href="#inicio">Início</a></li>
        <li><a href="#produtos">Cardápio</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </div>
  </header>

  <section class="hero" id="inicio">
    <h1 class="sr-only">Bella Napoli Pizzaria — Sabor que vem da Itália</h1>
    <div class="hero__media">
      <img
        src="imagens/banner.png"
        alt="Pizza Margherita recém-saída do forno, com fumaça subindo, ao lado da marca Bella Napoli Pizzaria"
      />
    </div>
    <div class="hero__scrim"></div>
    <div class="hero__wisp hero__wisp--1"></div>
    <div class="hero__wisp hero__wisp--2"></div>
    <div class="hero__wisp hero__wisp--3"></div>
    <div class="hero__wisp hero__wisp--4"></div>
    <div class="hero__content">
      <span class="hero__eyebrow">Direto do forno a lenha</span>
      <a href="#produtos" class="hero__cta">Ver cardápio</a>
    </div>
    <svg class="hero__wave" viewBox="0 0 2880 120" preserveAspectRatio="none" aria-hidden="true">
      <path class="hero__wave-path--back"
        d="M0,55 C160,10 320,95 480,55 C640,15 800,95 960,55 C1120,15 1280,95 1440,55
           C1600,15 1760,95 1920,55 C2080,15 2240,95 2400,55 C2560,15 2720,95 2880,55
           L2880,120 L0,120 Z" />
      <path class="hero__wave-path--front"
        d="M0,75 C180,35 340,110 500,75 C660,40 820,110 980,75 C1140,40 1300,110 1460,75
           C1620,40 1780,110 1940,75 C2100,40 2260,110 2420,75 C2580,40 2740,110 2880,75
           L2880,120 L0,120 Z" />
    </svg>
  </section>

  <section id="produtos">
    <div class="container">
      <h2>Cardápio</h2>
      <p class="subtitle">Adicione ao carrinho e finalize o pedido</p>
      <div class="produtos" id="produtos-lista"></div>
    </div>
  </section>

  <section id="contato" style="background:#fff;">
    <div class="container">
      <h2>Contato</h2>
      <form class="contact" id="formContato" novalidate>
        <div><label for="nome">Nome</label><input id="nome" required /></div>
        <div><label for="email">E-mail</label><input id="email" type="email" required /></div>
        <div><label for="mensagem">Mensagem</label><textarea id="mensagem" rows="3"></textarea></div>
        <button type="submit" class="btn primary">Enviar</button>
        <div class="mensagem-feedback" id="feedback"></div>
      </form>
    </div>
  </section>

  <!-- Botão flutuante do carrinho -->
  <button class="carrinho-icone" id="abrirCarrinho">🛒 <span id="qtd-carrinho">0</span></button>

  <!-- Drawer do carrinho -->
  <aside class="drawer" id="drawer">
    <header>
      <strong>Seu carrinho</strong>
      <button onclick="fecharCarrinho()" style="background:transparent;border:0;color:#fff;font-size:1.4rem;cursor:pointer;">×</button>
    </header>
    <div class="itens" id="carrinho-itens"></div>
    <footer>
      <p style="display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;">
        Total: <span id="total">R$ 0,00</span>
      </p>
      <button class="btn primary" style="width:100%;margin-top:10px;" onclick="finalizarPedido()">Finalizar pedido</button>
    </footer>
  </aside>

  <footer><p>© <span id="ano"></span> Bella Napoli Pizzaria</p></footer>

  <script>
    // Cada produto agora tem "img" apontando para o arquivo dentro da pasta /imagens.
    // Salve suas fotos com esses nomes exatos (ou ajuste o campo "img" abaixo para o nome real do arquivo).
    window.PRODUTOS = [
      { id: 1, nome: "Margherita", desc: "Molho, mussarela, manjericão", preco: 32.00, img: "imagens/margherita.png" },
      { id: 2, nome: "Calabresa", desc: "Calabresa fatiada e cebola", preco: 28.11, img: "imagens/calabresa.png" },
      { id: 3, nome: "Portuguesa", desc: "Presunto, ovo, cebola, ervilha", preco: 46.98, img: "imagens/portuguesa.png" },
      { id: 4, nome: "Quatro Queijos", desc: "Mussarela, provolone, parmesão, gorgonzola", preco: 31.00, img: "imagens/quatro-queijos.png" },
      { id: 5, nome: "Frango c/ Catupiry", desc: "Frango desfiado e catupiry", preco: 41.00, img: "imagens/frango-catupiry.png" },
      { id: 6, nome: "Chocolate", desc: "Doce com chocolate ao leite", preco: 42.00, img: "imagens/chocolate.png" },
      { id: 7, nome: "refrigerante", desc: "Coca-cola, fata uva, e guarana ", preco: 14.00, img: "imagens/refrigerante.png" }
    ];
    window.MOEDA = "R$";
    window.CTA = "Adicionar ao pedido";
    // Imagem exibida caso o arquivo do produto não seja encontrado
    window.IMG_FALLBACK = "imagens/placeholder.jpg";
  </script>
  <script src="script.js"></script>
</body>
</html>
